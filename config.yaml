brief:
  title: "EPS Corporation | GovCon Morning Intelligence Brief"
  lookback_hours: 36
  max_items: 45
  top_items: 10
  min_score: 5
  output_dir: "output"

  # Audit trail. When true, each run prints why items were filtered out and
  # writes output/EPS_GovCon_Dropped_YYYY-MM-DD.md with the full list, so you
  # can see exactly what the gate removed and which keyword did it.
  log_dropped: true
  log_dropped_preview: 15   # how many dropped items to sample in the console

  # Keep the brief on federal contracting. When true, an item is kept only if it
  # names a tracked agency, a watchlist company, or comes from a .gov/.mil
  # source. Event/capability keywords (awarded, software, AI, ...) add score and
  # tags but are too ambiguous to qualify a story on their own. Set false to see
  # everything that clears min_score.
  require_relevance: true

  # Hard exclusions: drop any item containing one of these whole words, even if
  # it matched an agency. Catches agency-name collisions and obvious off-topic
  # content. Add terms whenever you spot noise; remove any that hide real items.
  exclude_keywords:
    - "college football"
    - "NCAA"
    - "Army-Navy game"
    - "Navy football"
    - "Army football"
    - "Old Navy"
    - "Navy Federal"
    - "Salvation Army"
    - "rugby"
    - "playoff"
    - "Super Bowl"
    - "NBA"
    - "NFL"
    - "MLB"
    - "NHL"
    - "box office"
    - "Grammy"
    - "telethon"
    - "recipe"
    - "horoscope"

