# Trusted/high-value domains receive a small score boost.
source_priority:
  defense.gov: 3
  federalregister.gov: 3
  sam.gov: 3
  gao.gov: 3
  acquisition.gov: 3
  gsa.gov: 2
  sba.gov: 2
  dhs.gov: 2
  navy.mil: 2
  army.mil: 2
  af.mil: 2
  spaceforce.mil: 2
  uscg.mil: 2
  breakingdefense.com: 1
  defensenews.com: 1
  federalnewsnetwork.com: 1
  washingtontechnology.com: 1
  govconwire.com: 1
  executivegov.com: 1

# Google News RSS is used as an aggregator, not scraped HTML.
# Add/remove queries to tune coverage.
news_queries:
  - name: "Defense acquisition"
    query: '"defense contract" OR "contract award" OR "acquisition"'
  - name: "Navy Marine Corps"
    query: '"Navy" OR "Marine Corps" NAVSEA OR NAVAIR OR NAVWAR contract'
  - name: "Army"
    query: '"U.S. Army" contract OR acquisition OR modernization'
  - name: "Air Force Space Force"
    query: '"Air Force" OR "Space Force" contract OR acquisition'
  - name: "SOCOM"
    query: 'SOCOM OR USSOCOM OR "special operations" contract acquisition'
  - name: "DHS"
    query: 'DHS OR "Homeland Security" OR USCG OR CISA OR CBP contract acquisition'
  - name: "GovCon policy"
    query: 'FAR OR DFARS OR CMMC OR "federal acquisition" OR "small business contracting"'
  - name: "GovCon industry"
    query: '"government contracting" OR GovCon acquisition merger partnership executive'
  - name: "Defense industrial base"
    query: '"defense industrial base" manufacturing supply chain shipbuilding electronics'
  - name: "Federal technology"
    query: '"federal IT" OR cybersecurity OR DevSecOps OR C5ISR government contract'

federal_register:
  enabled: true
  agencies:
    - defense-department
    - homeland-security-department
    - general-services-administration
    - small-business-administration
  terms:
    - acquisition
    - procurement
    - contracting
    - small business
    - cybersecurity
    - defense industrial base
    - FAR
    - DFARS

sam:
  enabled: false
  # Enable after setting SAM_API_KEY in environment.
  posted_days: 2
  limit: 100

# GAO bid-protest decisions, pulled straight from GAO's public RSS.
# If GAO changes the feed path, update the URL here — no code change needed.
# Items are pre-tagged as Protest events and get the gao.gov source boost.
gao_protests:
  enabled: true
  feeds:
    - "https://www.gao.gov/rss/bid_protests.xml"
